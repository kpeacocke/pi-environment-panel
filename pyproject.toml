[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-environment-panel"
version = "0.1.0"
description = "One-page Raspberry Pi 5 environment and system-status panel for a Waveshare 4.3-inch UART e-paper display."
requires-python = ">=3.11"
authors = [{name = "KP"}]
license = "MIT"
dependencies = []

[project.scripts]
pi-panel = "pi_environment_panel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
